name: Deploy Aggregator Worker

on:
  workflow_dispatch:
  push:
    paths:
      - "workers/aggregator/**"
      - "deploy/cloudflare/schema-content.sql"
      - ".github/workflows/deploy-aggregator.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply content schema
        run: pnpm dlx wrangler@4.151.1 d1 execute chasey-stats --remote --file=deploy/cloudflare/schema-content.sql

      - name: Install Worker dependencies
        working-directory: workers/aggregator
        run: pnpm install --ignore-scripts

      - name: Typecheck Worker
        working-directory: workers/aggregator
        run: pnpm exec tsc --noEmit

      - name: Deploy Worker
        working-directory: workers/aggregator
        run: pnpm exec wrangler deploy
