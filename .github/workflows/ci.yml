name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm typecheck:functions

      - name: Typecheck aggregator Worker
        working-directory: workers/aggregator
        run: |
          pnpm install --ignore-scripts
          pnpm exec tsc --noEmit

      - run: pnpm build:cloudflare
      - run: pnpm check:static
